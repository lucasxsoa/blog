<!doctype html>
<html lang="{{ site.lang | default: 'pt-BR' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <div class="site">
      <header class="header">
        <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav aria-label="Navegação principal">
          <a href="{{ '/' | relative_url }}">Início</a>
          <a href="{{ '/sobre/' | relative_url }}">Sobre</a>
          <a href="{{ '/contato/' | relative_url }}">Contato</a>
        </nav>
      </header>

      <main>{{ content }}</main>

      <footer>© {{ 'now' | date: '%Y' }} {{ site.title }}</footer>
    </div>
  </body>
</html>
